<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otx Hub</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c10;--card:rgba(255,255,255,.03);--border:rgba(255,255,255,.08);
  --green:linear-gradient(135deg,#00b06f,#00e676);--red:linear-gradient(135deg,#ff5252,#ff1744);
  --blue:linear-gradient(135deg,#2979ff,#00b0ff);--purple:linear-gradient(135deg,#7c3aed,#a855f7);
  --txt:#fff;--muted:#8b949e;--g1:#00e676;--g2:#00b06f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;
  display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:40px 16px;position:relative;}
body::before{content:'';position:absolute;width:400px;height:400px;background:#00b06f;filter:blur(180px);
  opacity:.08;top:10%;left:10%;z-index:0;pointer-events:none}
body::after{content:'';position:absolute;width:400px;height:400px;background:#7c3aed;filter:blur(180px);
  opacity:.06;bottom:10%;right:10%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:20px;padding:32px 28px;
  box-shadow:0 16px 40px rgba(0,0,0,.4);}
.card.compact{padding:20px 24px}
/* ---- buttons ---- */
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;
  padding:14px 20px;font-size:15px;font-weight:600;color:#fff;border:none;
  border-radius:12px;cursor:pointer;font-family:inherit;transition:all .2s;width:100%;}
.btn-green{background:var(--green);box-shadow:0 6px 20px rgba(0,176,111,.25)}
.btn-green:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-red{background:var(--red);box-shadow:0 6px 20px rgba(255,23,68,.25)}
.btn-red:hover{filter:brightness(1.1)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;width:auto}
.btn-blue{background:var(--blue)}
.btn-purple{background:var(--purple)}
.btn.disabled{opacity:.4;pointer-events:none}
/* ---- forms ---- */
.fg{margin-bottom:18px;text-align:left}
label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
input,textarea{width:100%;padding:13px 14px;border-radius:10px;background:rgba(0,0,0,.25);
  border:1px solid var(--border);color:#fff;font-family:inherit;font-size:14px;
  transition:border-color .2s;resize:none}
input:focus,textarea:focus{outline:none;border-color:var(--g1)}
.hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
/* ---- headings ---- */
.page-title{font-size:22px;font-weight:800;letter-spacing:-.4px;
  background:linear-gradient(180deg,#fff,#d1d5db);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.section-title{font-size:13px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
/* ---- logo icon ---- */
.logo-icon{width:60px;height:60px;border-radius:16px;display:inline-flex;
  justify-content:center;align-items:center;margin-bottom:14px}
.logo-icon svg{width:30px;height:30px;fill:#fff}
.logo-icon.green{background:var(--green);box-shadow:0 8px 24px rgba(0,176,111,.3)}
.logo-icon.red{background:var(--red);box-shadow:0 8px 24px rgba(255,23,68,.3)}
.logo-icon.blue{background:var(--blue);box-shadow:0 8px 24px rgba(41,121,255,.3)}
/* ---- stat grid ---- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat-box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:left}
.stat-val{font-size:22px;font-weight:800;color:var(--g1)}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
/* ---- badges ---- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600}
.badge-green{background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);color:var(--g1)}
.badge-yellow{background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.2);color:#ffc107}
.badge-red{background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.2);color:#ff5252}
.badge-blue{background:rgba(41,121,255,.08);border:1px solid rgba(41,121,255,.2);color:#60a5fa}
/* ---- alerts ---- */
.alert{padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:16px;display:none;text-align:left}
.alert-red{background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.18);color:#ff5252}
.alert-yellow{background:rgba(255,193,7,.07);border:1px solid rgba(255,193,7,.18);color:#ffc107}
.alert-green{background:rgba(0,230,118,.07);border:1px solid rgba(0,230,118,.18);color:var(--g1)}
/* ---- divider ---- */
.divider{height:1px;background:var(--border);margin:20px 0}
/* ---- history list ---- */
.history-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px}
.history-item .hi-name{font-weight:600;color:#e2e8f0}
.history-item .hi-meta{color:var(--muted);font-size:11px;margin-top:2px}
.history-item .hi-right{text-align:right;flex-shrink:0}
/* ---- tabs ---- */
.tabs{display:flex;gap:6px;margin-bottom:20px;background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-radius:12px;padding:4px}
.tab{flex:1;padding:8px;font-size:13px;font-weight:600;color:var(--muted);
  border:none;background:transparent;cursor:pointer;border-radius:9px;font-family:inherit;transition:all .2s}
.tab.active{background:rgba(255,255,255,.08);color:#fff}
/* ---- verification ---- */
.verif-badge{padding:10px 16px;border-radius:12px;font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
/* ---- output box ---- */
.output-box{background:rgba(0,0,0,.3);border:1px dashed var(--border);border-radius:12px;padding:16px;display:none;margin-top:16px}
.output-url{font-family:monospace;font-size:11px;color:var(--g1);word-break:break-all;margin-bottom:10px;user-select:all;line-height:1.5}
/* ---- account card header ---- */
.acct-header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.acct-avatar{width:48px;height:48px;border-radius:14px;background:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.acct-info .acct-name{font-size:17px;font-weight:700}
.acct-info .acct-since{font-size:11px;color:var(--muted);margin-top:2px}
/* ---- security log ---- */
.sec-log{font-family:monospace;font-size:11px;color:#4ade80;background:rgba(0,0,0,.4);
  border:1px solid rgba(0,255,100,.1);border-radius:10px;padding:12px;
  max-height:140px;overflow-y:auto;line-height:1.8;white-space:pre-wrap;word-break:break-all}
/* ---- link rows ---- */
.link-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.link-row-id{font-family:monospace;font-size:12px;color:#94a3b8}
.link-row-actions{display:flex;gap:6px}
/* ---- honeypot ---- */
.hp{position:absolute;left:-9999px;top:-9999px;opacity:0;pointer-events:none}
/* ---- misc ---- */
.text-center{text-align:center}
.mt8{margin-top:8px}
.mt16{margin-top:16px}
.gap8{display:flex;gap:8px}
.fallback-link{display:none;margin-top:12px;font-size:12px;color:var(--muted)}
.fallback-link a{color:var(--g1);text-decoration:none;font-weight:600}
.credits{margin-top:20px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);opacity:.35;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script>
// ============================================================
// SECURITY
// ============================================================
const _k=[97,100,109,105,110,49,50,51];
const ADMIN_KEY=_k.map(c=>String.fromCharCode(c)).join('');
const RATE_LIMIT=12,RATE_MS=60000;

function checkRate(){
  const now=Date.now();
  let h=JSON.parse(sessionStorage.getItem('_rl')||'[]');
  h=h.filter(t=>now-t<RATE_MS);h.push(now);
  sessionStorage.setItem('_rl',JSON.stringify(h));
  return h.length>RATE_LIMIT;
}
function detectBot(){
  return[
    navigator.webdriver===true,
    navigator.plugins.length===0,
    /HeadlessChrome|PhantomJS|Googlebot|bot\b|crawl|spider/i.test(navigator.userAgent),
    !window.chrome&&/Chrome/.test(navigator.userAgent)&&!/Edg/.test(navigator.userAgent),
  ].filter(Boolean).length>=2;
}
function checkHp(){
  const a=document.getElementById('_hp1'),b=document.getElementById('_hp2');
  return(a&&a.value.length>0)||(b&&b.value.length>0);
}
const _t0=Date.now();
function tooFast(){return Date.now()-_t0<300;}

function getFingerprint(){
  return{ua:navigator.userAgent,lang:navigator.language,
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
    scr:`${screen.width}x${screen.height}`,plug:navigator.plugins.length,
    wd:navigator.webdriver,ts:new Date().toISOString()};
}
function sanitize(s){return(s||'').replace(/[^a-zA-Z0-9_]/g,'').substring(0,20);}

// ============================================================
// STORAGE — all data lives in localStorage, keyed by account
// ============================================================
const DB={
  get(k,def=null){try{const v=localStorage.getItem(k);return v===null?def:JSON.parse(v);}catch{return def;}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v));},
  del(k){localStorage.removeItem(k);}
};

// ============================================================
// ACCOUNT SYSTEM
// ============================================================
const ACCT_KEY='otx_account';
function getAccount(){return DB.get(ACCT_KEY,null);}
function saveAccount(a){DB.set(ACCT_KEY,a);}
function createAccount(username,password){
  const acct={
    username:sanitize(username)||username.substring(0,20),
    passwordHash:simpleHash(password),
    createdAt:Date.now(),
    lastLogin:Date.now(),
    totalLaunches:0,
    totalLinksGenerated:0,
    launchHistory:[],
    savedLinks:[],
    settings:{theme:'dark',notifications:true}
  };
  saveAccount(acct);
  return acct;
}
function loginAccount(username,password){
  const acct=getAccount();
  if(!acct)return null;
  if(acct.username.toLowerCase()===username.toLowerCase()&&acct.passwordHash===simpleHash(password)){
    acct.lastLogin=Date.now();
    saveAccount(acct);
    return acct;
  }
  return null;
}
// Simple non-crypto hash for local storage (not for real auth, just local UX)
function simpleHash(s){
  let h=0;
  for(let i=0;i<s.length;i++){h=Math.imul(31,h)+s.charCodeAt(i)|0;}
  return h.toString(36);
}

// ============================================================
// STATS
// ============================================================
const STATS_KEY='otx_stats';
function getStats(){
  return DB.get(STATS_KEY,{
    totalLaunches:0,totalLinks:0,totalVisits:0,
    lastLaunch:null,launchHistory:[],securityBlocks:0
  });
}
function bumpStat(k,extra={}){
  const s=getStats();
  s[k]=(s[k]||0)+1;
  s.totalVisits=(s.totalVisits||0);
  Object.assign(s,extra);
  DB.set(STATS_KEY,s);
}
function recordLaunch(placeId,username){
  const s=getStats();
  s.totalLaunches=(s.totalLaunches||0)+1;
  s.lastLaunch=Date.now();
  s.launchHistory=([{placeId,username,ts:Date.now()},...(s.launchHistory||[])]).slice(0,50);
  DB.set(STATS_KEY,s);
  // also update account
  const acct=getAccount();
  if(acct){
    acct.totalLaunches=(acct.totalLaunches||0)+1;
    acct.launchHistory=([{placeId,username,ts:Date.now()},...(acct.launchHistory||[])]).slice(0,30);
    saveAccount(acct);
  }
}
function recordLinkGen(placeId){
  const s=getStats();
  s.totalLinks=(s.totalLinks||0)+1;
  DB.set(STATS_KEY,s);
  const acct=getAccount();
  if(acct){
    acct.totalLinksGenerated=(acct.totalLinksGenerated||0)+1;
    acct.savedLinks=([{placeId,ts:Date.now()},...(acct.savedLinks||[])]).slice(0,20);
    saveAccount(acct);
  }
}

// ============================================================
// SECURITY LOG
// ============================================================
const SEC_KEY='otx_seclog';
function secLog(msg){
  const logs=DB.get(SEC_KEY,[]);
  logs.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);
  DB.set(SEC_KEY,logs.slice(0,100));
}

// ============================================================
// URL HELPERS
// ============================================================
function parsePlaceId(raw){
  raw=(raw||'').trim();if(!raw)return'';
  const u=raw.match(/(?:games|place)\D*?(\d{5,})/i);if(u)return u[1];
  const d=raw.match(/^(\d+)$/);return d?d[1]:'';
}
function parseServerCode(raw){
  raw=(raw||'').trim();if(!raw)return null;
  const u=raw.match(/privateServerLinkCode=([A-Za-z0-9_-]+)/i);if(u)return{code:u[1],kind:'link'};
  const sh=raw.match(/roblox\.com\/share\?[^\s]*code=([A-Za-z0-9_-]+)/i);if(sh)return{code:sh[1],kind:'share'};
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(raw))return{code:raw,kind:'legacy'};
  if(/^[0-9a-f]{32}$/i.test(raw))return{code:raw,kind:'link'};
  if(/^\d{12,}$/.test(raw))return{code:raw,kind:'share-id'};
  return{code:raw,kind:'unknown'};
}
function parseAllowList(raw){
  return(raw||'').split(/[\n,]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
}
function timeAgo(ts){
  const d=Date.now()-ts,m=Math.floor(d/60000),h=Math.floor(d/3600000);
  if(d<60000)return'just now';
  if(m<60)return`${m}m ago`;
  if(h<24)return`${h}h ago`;
  return`${Math.floor(h/24)}d ago`;
}

// ============================================================
// RENDER ENGINE
// ============================================================
const root=document.getElementById('root');
function render(html){root.innerHTML=html;}

// ============================================================
// VIEW: BLOCKED
// ============================================================
function showBlocked(title,msg,ip=''){
  render(`
  <div class="card text-center">
    <div class="logo-icon red" style="margin:0 auto 14px">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l5 2.18V11c0 3.61-2.44 7.01-5 8.07C9.44 18.01 7 14.61 7 11V7.18L12 5zm-1 3v4h2V8h-2zm0 6v2h2v-2h-2z"/></svg>
    </div>
    <div class="page-title">${title}</div>
    <div class="page-sub" style="margin-bottom:16px">${msg}</div>
    ${ip?`<span class="badge badge-red">${ip}</span>`:''}
    <div class="credits">Credits to ducky</div>
  </div>`);
}

// ============================================================
// VIEW: REGISTER / LOGIN
// ============================================================
function showAuth(tab='register'){
  const acct=getAccount();
  render(`
  <div class="card">
    <div class="logo-icon green" style="margin:0 auto 14px">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
    </div>
    <div class="page-title text-center">Otx Hub</div>
    <div class="page-sub text-center" style="margin-bottom:20px">Your personal Roblox launch hub</div>

    <div class="tabs">
      <button class="tab${tab==='register'?' active':''}" onclick="showAuth('register')">Create account</button>
      <button class="tab${tab==='login'?' active':''}" onclick="showAuth('login')">Sign in</button>
    </div>

    <div id="auth-alert" class="alert alert-red"></div>

    ${tab==='register'?`
    <div class="fg"><label>Username</label>
      <input id="a-user" placeholder="YourUsername" maxlength="20" autocomplete="off">
      <p class="hint">Letters, numbers and underscores only.</p>
    </div>
    <div class="fg"><label>Password</label>
      <input type="password" id="a-pass" placeholder="Choose a password" autocomplete="new-password">
    </div>
    <div class="fg"><label>Confirm password</label>
      <input type="password" id="a-pass2" placeholder="Repeat password" autocomplete="new-password">
    </div>
    <button class="btn btn-green" onclick="doRegister()">Create account</button>
    ${acct?`<p class="hint text-center mt8">Existing account found for <strong>${acct.username}</strong>. <a href="#" style="color:var(--g1)" onclick="showAuth('login')">Sign in instead</a></p>`:''}
    `:`
    <div class="fg"><label>Username</label>
      <input id="a-user" placeholder="YourUsername" maxlength="20" autocomplete="username">
    </div>
    <div class="fg"><label>Password</label>
      <input type="password" id="a-pass" placeholder="Your password" autocomplete="current-password">
    </div>
    <button class="btn btn-green" onclick="doLogin()">Sign in</button>
    ${acct?`<p class="hint text-center mt8">Account: <strong>${acct.username}</strong></p>`:''}
    `}
    <input class="hp" type="text" id="_hp1" tabindex="-1" autocomplete="off">
    <input class="hp" type="text" id="_hp2" tabindex="-1" autocomplete="off">
    <div class="credits">Credits to ducky</div>
  </div>`);

  // Enter key support
  setTimeout(()=>{
    ['a-user','a-pass','a-pass2'].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter'){tab==='register'?doRegister():doLogin();}});
    });
  },0);
}

function authAlert(msg){
  const el=document.getElementById('auth-alert');
  if(!el)return;
  el.textContent=msg;el.style.display='block';
}
function doRegister(){
  if(checkHp()){secLog('HONEYPOT triggered on register');showBlocked('Bot detected','Automated access blocked.');return;}
  const u=(document.getElementById('a-user')?.value||'').trim();
  const p=document.getElementById('a-pass')?.value||'';
  const p2=document.getElementById('a-pass2')?.value||'';
  if(!u||u.length<3){authAlert('Username must be at least 3 characters.');return;}
  if(!/^[a-zA-Z0-9_]+$/.test(u)){authAlert('Username can only contain letters, numbers, and underscores.');return;}
  if(!p||p.length<6){authAlert('Password must be at least 6 characters.');return;}
  if(p!==p2){authAlert('Passwords do not match.');return;}
  const acct=createAccount(u,p);
  secLog(`Account created: ${acct.username}`);
  bumpStat('totalVisits');
  sessionStorage.setItem('_authed','1');
  showDashboard();
}
function doLogin(){
  if(checkHp()){secLog('HONEYPOT triggered on login');showBlocked('Bot detected','Automated access blocked.');return;}
  const u=(document.getElementById('a-user')?.value||'').trim();
  const p=document.getElementById('a-pass')?.value||'';
  if(!u||!p){authAlert('Enter username and password.');return;}
  const acct=loginAccount(u,p);
  if(!acct){authAlert('Incorrect username or password.');secLog(`Failed login attempt: ${u}`);return;}
  secLog(`Login: ${acct.username}`);
  sessionStorage.setItem('_authed','1');
  showDashboard();
}
function doRegisterAndAuth(u,p){
  sessionStorage.setItem('_authed','1');
}

// ============================================================
// VIEW: DASHBOARD (logged in)
// ============================================================
function showDashboard(tab='home'){
  const acct=getAccount();
  if(!acct){showAuth();return;}
  const stats=getStats();
  const initial=acct.username[0].toUpperCase();

  const tabs=['home','generate','history','security','settings'];
  const tabLabels={home:'Home',generate:'Generate',history:'History',security:'Security',settings:'Settings'};

  let content='';

  if(tab==='home'){
    content=`
    <div class="acct-header">
      <div class="acct-avatar">${initial}</div>
      <div class="acct-info">
        <div class="acct-name">${acct.username}</div>
        <div class="acct-since">Member since ${new Date(acct.createdAt).toLocaleDateString()}</div>
      </div>
      <span class="badge badge-green" style="margin-left:auto">Active</span>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val">${acct.totalLaunches||0}</div><div class="stat-lbl">Total launches</div></div>
      <div class="stat-box"><div class="stat-val">${acct.totalLinksGenerated||0}</div><div class="stat-lbl">Links generated</div></div>
      <div class="stat-box"><div class="stat-val">${(acct.launchHistory||[]).length}</div><div class="stat-lbl">Launch history</div></div>
      <div class="stat-box"><div class="stat-val">${(acct.savedLinks||[]).length}</div><div class="stat-lbl">Saved links</div></div>
    </div>

    <div class="section-title">Recent launches</div>
    <div class="history-list">
      ${(acct.launchHistory||[]).slice(0,5).map(h=>`
      <div class="history-item">
        <div><div class="hi-name">Place ${h.placeId}</div><div class="hi-meta">as @${h.username||'unknown'}</div></div>

function doLogout(){
  // Don't delete account — just go back to auth
  showAuth('login');

let _lastGenUrl='';
function doGenerate(){
  const pid=parsePlaceId(document.getElementById('g-place')?.value||'');
  const parsed=parseServerCode(document.getElementById('g-code')?.value||'');
  const allowUsers=parseAllowList(document.getElementById('g-allow')?.value||'');
  const label=(document.getElementById('g-label')?.value||'').trim();
  const alertEl=document.getElementById('gen-alert');
  const outputEl=document.getElementById('gen-output');
  const urlEl=document.getElementById('gen-url');
  if(alertEl){alertEl.style.display='none';}
  if(outputEl){outputEl.style.display='none';}
  if(!pid){
    if(alertEl){alertEl.textContent='Place ID missing.';alertEl.style.display='block';}
    return;
  }
  if(parsed&&parsed.kind==='share-id'){
    if(alertEl){alertEl.textContent='That is a share-link ID, not a server code.';alertEl.style.display='block';}
    return;
  }
  const base64Id=btoa(pid);
  const baseUrl=window.location.origin+window.location.pathname;
  let url=`${baseUrl}?id=${base64Id}`;
  if(parsed&&parsed.code){
    url+=`&linkCode=${encodeURIComponent(parsed.code)}`;
    if(parsed.kind==='legacy')url+=`&codeKind=legacy`;
  }
  if(allowUsers.length)url+=`&allow=${encodeURIComponent(btoa(allowUsers.join(',')))}`;
  _lastGenUrl=url;
  if(urlEl)urlEl.textContent=url;
  if(outputEl)outputEl.style.display='block';
  recordLinkGen(pid);
  // save with label
  const acct=getAccount();
  if(acct){
    acct.savedLinks=([{placeId:pid,label,ts:Date.now(),url},...(acct.savedLinks||[])]).slice(0,20);
    saveAccount(acct);
  }
  secLog(`Link generated for place ${pid}`);
}
function copyGenLink(){
  navigator.clipboard.writeText(_lastGenUrl).then(()=>{
    const a=document.getElementById('gen-alert');
    if(a){a.className='alert alert-green mt8';a.textContent='Link copied.';a.style.display='block';}
  });
}
function openGenLink(){if(_lastGenUrl)window.open(_lastGenUrl,'_blank');}

function revokeLink(placeId){
  localStorage.setItem(`revoked_${placeId}`,'true');
  secLog(`Link revoked: place ${placeId}`);
  showDashboard('generate');
}

function doRevoke(shouldRevoke){
  const id=parsePlaceId(document.getElementById('sec-revoke')?.value||'');
  const a=document.getElementById('sec-alert');
  if(!id){if(a){a.textContent='Enter a Place ID.';a.style.display='block';}return;}
  if(shouldRevoke){
    localStorage.setItem(`revoked_${id}`,'true');
    secLog(`Manual revoke: place ${id}`);
    if(a){a.textContent=`Place ${id} revoked.`;a.className='alert alert-red mt8';a.style.display='block';}
  }else{
    localStorage.removeItem(`revoked_${id}`);
    secLog(`Restore: place ${id}`);
    if(a){a.textContent=`Place ${id} restored.`;a.className='alert alert-green mt8';a.style.display='block';}
  }
}

function clearHistory(){
  const acct=getAccount();
  if(acct){acct.launchHistory=[];saveAccount(acct);}
  showDashboard('history');
}

function saveSettings(){
  const acct=getAccount();if(!acct)return;
  const name=(document.getElementById('s-name')?.value||'').trim();
  const pass=document.getElementById('s-pass')?.value||'';
  const pass2=document.getElementById('s-pass2')?.value||'';
  const a=document.getElementById('set-alert');
  if(name&&name.length>=3&&/^[a-zA-Z0-9_]+$/.test(name))acct.username=name;
  if(pass){
    if(pass.length<6){if(a){a.className='alert alert-red mt8';a.textContent='Password too short.';a.style.display='block';}return;}
    if(pass!==pass2){if(a){a.className='alert alert-red mt8';a.textContent='Passwords do not match.';a.style.display='block';}return;}
    acct.passwordHash=simpleHash(pass);
  }
  saveAccount(acct);
  if(a){a.className='alert alert-green mt8';a.textContent='Settings saved.';a.style.display='block';}
}

function exportData(){
  const data={account:getAccount(),stats:getStats(),seclog:DB.get(SEC_KEY,[])};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='otxhub-data.json';a.click();
  URL.revokeObjectURL(url);
}

function deleteAccount(){
  if(!confirm('Delete your account and all data? This cannot be undone.'))return;
  DB.del(ACCT_KEY);DB.del(STATS_KEY);DB.del(SEC_KEY);
  showAuth('register');
}

function copyAdminLink(){
  const url=`${window.location.origin}${window.location.pathname}?key=${ADMIN_KEY}`;
  navigator.clipboard.writeText(url).then(()=>{
    const a=document.getElementById('set-alert2');
    if(a){a.textContent='Admin link copied.';a.style.display='block';}
  });
}

let _verifiedHuman=false;

function showLauncher(){
  render(`

    <div class="fg">
      <label>Roblox username</label>

    <button id="launch-btn" class="btn btn-green disabled" onclick="doLaunch()">Join Experience</button>
    <div class="fallback-link" id="fallback-link">
      Nothing happened? <a id="web-fallback" href="https://www.roblox.com/games/${_placeId}" target="_blank" rel="noopener">Open on Roblox website</a>
    </div>
    <div class="credits">Credits to ducky</div>
  </div>`);

  const input=document.getElementById('launch-user');
  if(input){
    input.addEventListener('input',updateLaunchBtn);
    input.addEventListener('paste',e=>{
      e.preventDefault();
      const t=(e.clipboardData||window.clipboardData).getData('text');
      input.value=sanitize(t);updateLaunchBtn();
    });
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!document.getElementById('launch-btn')?.classList.contains('disabled'))doLaunch();});
  }
  initLauncherVerif();
}

function updateLaunchBtn(){
  const btn=document.getElementById('launch-btn');
  const u=sanitize(document.getElementById('launch-user')?.value||'');
  if(_verifiedHuman&&u.length>0)btn?.classList.remove('disabled');
  else btn?.classList.add('disabled');
}

function initLauncherVerif(){
  function verify(){
    if(_verifiedHuman)return;
    if(checkHp()){secLog('HONEYPOT on launcher');showBlocked('Bot detected','Automated access blocked.');return;}
    _verifiedHuman=true;
    const b=document.getElementById('verif-badge');
    if(b){
      b.className='verif-badge badge-green';
      b.innerHTML=`<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Verified browser connection`;
    }
    updateLaunchBtn();
    ['mousemove','touchstart','keydown'].forEach(e=>window.removeEventListener(e,verify));
  }
  ['mousemove','touchstart','keydown'].forEach(e=>window.addEventListener(e,verify));
}

function doLaunch(){
  if(!_verifiedHuman||!_placeId)return;
  if(checkHp()){secLog('HONEYPOT on launch');showBlocked('Bot detected','Automated access blocked.');return;}
  if(tooFast()){secLog('TIMING attack on launch');showBlocked('Bot detected','Automated access blocked.');return;}
  const u=sanitize(document.getElementById('launch-user')?.value||'');
  const alertEl=document.getElementById('launch-alert');
  if(!u){if(alertEl){alertEl.textContent='Enter your Roblox username.';alertEl.style.display='block';}return;}
  if(_allowList.length&&!_allowList.includes(u.toLowerCase())){
    if(alertEl){alertEl.textContent="That username isn't on the invite list.";alertEl.style.display='block';}
    return;
  }
  if(alertEl)alertEl.style.display='none';

  // Verify sequence
  const badge=document.getElementById('verif-badge');
  const btn=document.getElementById('launch-btn');
  const input=document.getElementById('launch-user');
  if(badge){badge.className='verif-badge badge-yellow';badge.innerHTML=`<span>Verifying @${u}…</span>`;}
  if(btn)btn.classList.add('disabled');
  if(input)input.disabled=true;

  setTimeout(()=>{
    if(badge){
      badge.className='verif-badge badge-green';
      badge.innerHTML=`<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Verified @${u} — launching…`;
    }
    if(btn)btn.textContent='Opening Roblox…';
    setTimeout(()=>{
      let url=`roblox://experiences/start?placeId=${_placeId}`;
      if(_rawCode){const p=_codeKind==='legacy'?'accessCode':'linkCode';url+=`&${p}=${encodeURIComponent(_rawCode)}`;}
      window.location.href=url;
      recordLaunch(_placeId,u);
      secLog(`Launch: place ${_placeId} by @${u}`);
      setTimeout(()=>{const f=document.getElementById('fallback-link');if(f)f.style.display='block';},2500);
    },600);
  },900);
}

function adminRevoke(rev){
  const id=parsePlaceId(document.getElementById('adm-revoke')?.value||'');
  const a=document.getElementById('adm-rev-alert');
  if(!id){if(a){a.textContent='Enter a Place ID.';a.style.display='block';}return;}
  if(rev){localStorage.setItem(`revoked_${id}`,'true');if(a){a.textContent=`Place ${id} revoked.`;a.className='alert alert-red mt8';a.style.display='block';}}
  else{localStorage.removeItem(`revoked_${id}`);if(a){a.textContent=`Place ${id} restored.`;a.className='alert alert-green mt8';a.style.display='block';}}
  secLog(`${rev?'Revoke':'Restore'}: place ${id}`);
}

// ============================================================
// BOOT
// ============================================================
(function boot(){
  const fp=getFingerprint();
  secLog(`Visit from ${fp.ua.substring(0,60)} | ${fp.tz}`);
  bumpStat('totalVisits');

  if(checkRate()){
    secLog('RATE LIMIT exceeded');
    const s=getStats();s.securityBlocks=(s.securityBlocks||0)+1;DB.set(STATS_KEY,s);
    showBlocked('Rate limit exceeded','Too many requests. Try again in a minute.');
    return;
  }
  if(detectBot()){
    secLog('BOT detected: '+getFingerprint().ua.substring(0,80));
    const s=getStats();s.securityBlocks=(s.securityBlocks||0)+1;DB.set(STATS_KEY,s);
    showBlocked('Bot detected','Automated access is not permitted.');
    return;
  }

  const params=new URLSearchParams(window.location.search);
  const encodedId=params.get('id');
  _rawCode=params.get('linkCode')||params.get('accessCode')||params.get('accesscode')||'';
  _codeKind=params.get('codeKind')||'';
  const key=params.get('key');

  const encodedAllow=params.get('allow');
  if(encodedAllow){try{_allowList=atob(encodedAllow).split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);}catch{_allowList=[];}}

  try{if(encodedId)_placeId=atob(encodedId).trim();}catch{_placeId='';}
  if(!/^\d+$/.test(_placeId))_placeId='';

  const isRevoked=_placeId?localStorage.getItem(`revoked_${_placeId}`)==='true':false;

  if(isRevoked){
    showBlocked('Link invalid','This launch URL has been deactivated by the admin.');
    return;
  }

  if(key===ADMIN_KEY){showAdmin();return;}

  if(_placeId){showLauncher();return;}

  // No link params — show account dashboard or auth
  const acct=getAccount();
  if(acct){
    // Verify password on return visit via session flag
    const sessionAuthed=sessionStorage.getItem('_authed');
    if(sessionAuthed==='1'){showDashboard();return;}
    // Ask to sign back in
    showAuth('login');
  } else {
    showAuth('register');
  }
})();
</script>
