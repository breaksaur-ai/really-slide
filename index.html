<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Launcher</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c10;--card:rgba(255,255,255,.03);--border:rgba(255,255,255,.08);
  --green:linear-gradient(135deg,#00b06f,#00e676);--red:linear-gradient(135deg,#ff5252,#ff1744);
  --blue:linear-gradient(135deg,#2979ff,#00b0ff);--purple:linear-gradient(135deg,#7c3aed,#a855f7);
  --txt:#fff;--muted:#8b949e;--g1:#00e676;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;
  display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:40px 16px;position:relative;}
body::before{content:'';position:absolute;width:400px;height:400px;background:#00b06f;filter:blur(180px);
  opacity:.08;top:10%;left:10%;z-index:0;pointer-events:none}
body::after{content:'';position:absolute;width:400px;height:400px;background:#7c3aed;filter:blur(180px);
  opacity:.06;bottom:10%;right:10%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:20px;padding:32px 28px;box-shadow:0 16px 40px rgba(0,0,0,.4);}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;
  padding:14px 20px;font-size:15px;font-weight:600;color:#fff;border:none;
  border-radius:12px;cursor:pointer;font-family:inherit;transition:all .2s;width:100%;}
.btn-green{background:var(--green);box-shadow:0 6px 20px rgba(0,176,111,.25)}
.btn-green:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-red{background:var(--red)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn-blue{background:var(--blue)}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;width:auto}
.btn.disabled{opacity:.4;pointer-events:none}
.fg{margin-bottom:18px;text-align:left}
label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;padding:13px 14px;border-radius:10px;background:rgba(0,0,0,.25);
  border:1px solid var(--border);color:#fff;font-family:inherit;font-size:14px;transition:border-color .2s;}
input:focus{outline:none;border-color:var(--g1)}
.hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.4px;
  background:linear-gradient(180deg,#fff,#d1d5db);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.section-title{font-size:13px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.logo-icon{width:60px;height:60px;border-radius:16px;display:inline-flex;justify-content:center;align-items:center;margin-bottom:14px}
.logo-icon svg{width:30px;height:30px;fill:#fff}
.logo-icon.green{background:var(--green);box-shadow:0 8px 24px rgba(0,176,111,.3)}
.logo-icon.red{background:var(--red);box-shadow:0 8px 24px rgba(255,23,68,.3)}
.logo-icon.blue{background:var(--blue);box-shadow:0 8px 24px rgba(41,121,255,.3)}
.logo-icon.purple{background:var(--purple);box-shadow:0 8px 24px rgba(124,58,237,.3)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat-box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:left}
.stat-val{font-size:22px;font-weight:800;color:var(--g1)}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600}
.badge-green{background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);color:var(--g1)}
.badge-yellow{background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.2);color:#ffc107}
.badge-red{background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.2);color:#ff5252}
.badge-blue{background:rgba(41,121,255,.08);border:1px solid rgba(41,121,255,.2);color:#60a5fa}
.badge-purple{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);color:#a78bfa}
.alert{padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:16px;display:none;text-align:left}
.alert-red{background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.18);color:#ff5252}
.alert-yellow{background:rgba(255,193,7,.07);border:1px solid rgba(255,193,7,.18);color:#ffc107}
.alert-green{background:rgba(0,230,118,.07);border:1px solid rgba(0,230,118,.18);color:var(--g1)}
.divider{height:1px;background:var(--border);margin:20px 0}
.history-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px}
.hi-name{font-weight:600;color:#e2e8f0}
.hi-meta{color:var(--muted);font-size:11px;margin-top:2px}
.hi-right{text-align:right;flex-shrink:0}
.tabs{display:flex;gap:6px;margin-bottom:20px;background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-radius:12px;padding:4px}
.tab{flex:1;padding:8px;font-size:12px;font-weight:600;color:var(--muted);
  border:none;background:transparent;cursor:pointer;border-radius:9px;font-family:inherit;transition:all .2s}
.tab.active{background:rgba(255,255,255,.08);color:#fff}
.verif-badge{padding:10px 16px;border-radius:12px;font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
.output-box{background:rgba(0,0,0,.3);border:1px dashed var(--border);border-radius:12px;padding:16px;display:none;margin-top:16px}
.output-url{font-family:monospace;font-size:11px;color:var(--g1);word-break:break-all;margin-bottom:10px;user-select:all;line-height:1.5}
.acct-header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.acct-avatar{width:48px;height:48px;border-radius:14px;background:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.acct-info .acct-name{font-size:17px;font-weight:700}
.acct-info .acct-since{font-size:11px;color:var(--muted);margin-top:2px}
.sec-log{font-family:monospace;font-size:11px;color:#4ade80;background:rgba(0,0,0,.4);
  border:1px solid rgba(0,255,100,.1);border-radius:10px;padding:12px;
  max-height:140px;overflow-y:auto;line-height:1.8;white-space:pre-wrap;word-break:break-all}
.link-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.link-row-id{font-family:monospace;font-size:12px;color:#94a3b8}
/* honeypot */
.hp{position:absolute;left:-9999px;top:-9999px;opacity:0;pointer-events:none}
.text-center{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}
.gap8{display:flex;gap:8px}
.fallback-link{display:none;margin-top:12px;font-size:12px;color:var(--muted)}
.fallback-link a{color:var(--g1);text-decoration:none;font-weight:600}
.credits{margin-top:20px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);opacity:.35;text-align:center}
/* TOTP input styling */
.totp-grid{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.totp-grid input{width:44px;height:52px;text-align:center;font-size:20px;font-weight:700;padding:0;border-radius:10px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
// ============================================================
// SECURITY CONSTANTS
// Admin key is split across 3 arrays and assembled at runtime.
// There is NO admin param in the URL. Entry is via a secret
// Konami-style key sequence typed anywhere on the page.
// ============================================================

// Secret admin entry: type "otxadmin" anywhere on the page
// This is obfuscated — the chars are stored as char codes
const _ENTRY=[111,116,120,97,100,109,105,110]; // "otxadmin"
let _entryBuffer=[];

// Admin password is hashed — never stored in plaintext
// Default: change this to simpleHash("yourpassword") after first run
// To get your hash, open console and type: simpleHash("yourpassword")
const ADMIN_PASS_HASH='1ekr1c6'; // = simpleHash("admin123") — CHANGE THIS

// Member registration token — users need this to register
// Share this with people you want to allow accounts
// Obfuscated as char codes: "invite2025"
const _INVITE=[105,110,118,105,116,101,50,48,50,53];
const INVITE_TOKEN=_INVITE.map(c=>String.fromCharCode(c)).join('');

// Session token length
const TOKEN_LEN=32;
const SESSION_KEY='_otx_s';
const ACCT_KEY='_otx_a';
const STATS_KEY='_otx_st';
const SEC_KEY='_otx_sl';

// Rate limiting
const RATE_LIMIT=12,RATE_MS=60000;
// Login brute force protection
const MAX_LOGIN_ATTEMPTS=5,LOGIN_LOCKOUT_MS=15*60*1000;

// ============================================================
// SECURITY FUNCTIONS
// ============================================================
function checkRate(){
  const now=Date.now();
  let h=JSON.parse(sessionStorage.getItem('_rl')||'[]');
  h=h.filter(t=>now-t<RATE_MS);h.push(now);
  sessionStorage.setItem('_rl',JSON.stringify(h));
  return h.length>RATE_LIMIT;
}
function detectBot(){
  return[
    navigator.webdriver===true,
    navigator.plugins.length===0,
    /HeadlessChrome|PhantomJS|Googlebot|bot\b|crawl|spider/i.test(navigator.userAgent),
    !window.chrome&&/Chrome/.test(navigator.userAgent)&&!/Edg|OPR|Samsung/.test(navigator.userAgent),
    typeof window.callPhantom==='function',
    typeof window._phantom!=='undefined',
  ].filter(Boolean).length>=2;
}
function checkHp(){
  const a=document.getElementById('_hp1'),b=document.getElementById('_hp2');
  return(a&&a.value.length>0)||(b&&b.value.length>0);
}
const _t0=Date.now();
function tooFast(){return Date.now()-_t0<400;}

function simpleHash(s){
  let h=0x811c9dc5;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}
  return h.toString(36);
}
function generateToken(){
  const a=new Uint8Array(TOKEN_LEN);
  crypto.getRandomValues(a);
  return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
}
function sanitize(s){return(s||'').replace(/[^a-zA-Z0-9_]/g,'').substring(0,20);}
function sanitizeLabel(s){return(s||'').replace(/[<>"'&]/g,'').substring(0,40);}

// ============================================================
// LOGIN LOCKOUT
// ============================================================
function getLoginState(){
  return JSON.parse(localStorage.getItem('_otx_ls')||'{"attempts":0,"lockedUntil":0}');
}
function recordLoginAttempt(success){
  const ls=getLoginState();
  if(success){ls.attempts=0;ls.lockedUntil=0;}
  else{
    ls.attempts=(ls.attempts||0)+1;
    if(ls.attempts>=MAX_LOGIN_ATTEMPTS)ls.lockedUntil=Date.now()+LOGIN_LOCKOUT_MS;
  }
  localStorage.setItem('_otx_ls',JSON.stringify(ls));
  return ls;
}
function isLockedOut(){
  const ls=getLoginState();
  return ls.lockedUntil&&Date.now()<ls.lockedUntil;
}
function lockoutRemaining(){
  const ls=getLoginState();
  return Math.ceil((ls.lockedUntil-Date.now())/60000);
}

// ============================================================
// SESSION MANAGEMENT
// Token stored in sessionStorage only (clears on tab close)
// Account data in localStorage (persists)
// ============================================================
function getSession(){return sessionStorage.getItem(SESSION_KEY);}
function setSession(token){sessionStorage.setItem(SESSION_KEY,token);}
function clearSession(){sessionStorage.removeItem(SESSION_KEY);}

function getAccount(){return JSON.parse(localStorage.getItem(ACCT_KEY)||'null');}
function saveAccount(a){localStorage.setItem(ACCT_KEY,JSON.stringify(a));}

function isValidSession(){
  const token=getSession();
  const acct=getAccount();
  if(!token||!acct)return false;
  return acct.sessionToken===token;
}
function isAdmin(){
  const acct=getAccount();
  return isValidSession()&&acct&&acct.role==='admin';
}

function createSession(acct){
  const token=generateToken();
  acct.sessionToken=token;
  acct.lastLogin=Date.now();
  saveAccount(acct);
  setSession(token);
  return token;
}

// ============================================================
// STORAGE HELPERS
// ============================================================
const DB={
  get(k,def=null){try{const v=localStorage.getItem(k);return v===null?def:JSON.parse(v);}catch{return def;}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v));},
  del(k){localStorage.removeItem(k);}
};

// ============================================================
// ACCOUNT SYSTEM
// ============================================================
function createAccount(username,passwordHash,role='member'){
  const acct={
    username,
    passwordHash,
    role,
    createdAt:Date.now(),
    lastLogin:Date.now(),
    sessionToken:null,
    totalLaunches:0,
    totalLinksGenerated:0,
    launchHistory:[],
    savedLinks:[],
  };
  saveAccount(acct);
  return acct;
}

// ============================================================
// STATS
// ============================================================
function getStats(){
  return DB.get(STATS_KEY,{totalLaunches:0,totalLinks:0,totalVisits:0,securityBlocks:0,launchHistory:[]});
}
function bumpStat(k){const s=getStats();s[k]=(s[k]||0)+1;DB.set(STATS_KEY,s);}
function recordLaunch(placeId,username){
  const s=getStats();s.totalLaunches=(s.totalLaunches||0)+1;s.lastLaunch=Date.now();
  s.launchHistory=([{placeId,username,ts:Date.now()},...(s.launchHistory||[])]).slice(0,50);
  DB.set(STATS_KEY,s);
  const acct=getAccount();
  if(acct&&isValidSession()){
    acct.totalLaunches=(acct.totalLaunches||0)+1;
    acct.launchHistory=([{placeId,username,ts:Date.now()},...(acct.launchHistory||[])]).slice(0,30);
    saveAccount(acct);
  }
}
function recordLinkGen(placeId,label=''){
  const s=getStats();s.totalLinks=(s.totalLinks||0)+1;DB.set(STATS_KEY,s);
  const acct=getAccount();
  if(acct&&isValidSession()){
    acct.totalLinksGenerated=(acct.totalLinksGenerated||0)+1;
    acct.savedLinks=([{placeId,label:sanitizeLabel(label),ts:Date.now()},...(acct.savedLinks||[])]).slice(0,20);
    saveAccount(acct);
  }
}

// ============================================================
// SECURITY LOG
// ============================================================
function secLog(msg){
  const logs=DB.get(SEC_KEY,[]);
  logs.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);
  DB.set(SEC_KEY,logs.slice(0,200));
}

// ============================================================
// URL HELPERS
// ============================================================
function parsePlaceId(raw){
  raw=(raw||'').trim();if(!raw)return'';
  const u=raw.match(/(?:games|place)\D*?(\d{5,})/i);if(u)return u[1];
  const d=raw.match(/^(\d+)$/);return d?d[1]:'';
}
function parseServerCode(raw){
  raw=(raw||'').trim();if(!raw)return null;
  const u=raw.match(/privateServerLinkCode=([A-Za-z0-9_-]+)/i);if(u)return{code:u[1],kind:'link'};
  const sh=raw.match(/roblox\.com\/share\?[^\s]*code=([A-Za-z0-9_-]+)/i);if(sh)return{code:sh[1],kind:'share'};
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(raw))return{code:raw,kind:'legacy'};
  if(/^[0-9a-f]{32}$/i.test(raw))return{code:raw,kind:'link'};
  if(/^\d{12,}$/.test(raw))return{code:raw,kind:'share-id'};
  return{code:raw,kind:'unknown'};
}
function parseAllowList(raw){
  return(raw||'').split(/[\n,]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
}
function timeAgo(ts){
  const d=Date.now()-ts,m=Math.floor(d/60000),h=Math.floor(d/3600000);
  if(d<60000)return'just now';if(m<60)return`${m}m ago`;
  if(h<24)return`${h}h ago`;return`${Math.floor(h/24)}d ago`;
}

// ============================================================
// RENDER
// ============================================================
const root=document.getElementById('root');
function render(html){root.innerHTML=html;}

// ============================================================
// VIEW: BLOCKED
// ============================================================
function showBlocked(title,msg){
  render(`<div class="card text-center">
    <div class="logo-icon red" style="margin:0 auto 14px">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l5 2.18V11c0 3.61-2.44 7.01-5 8.07C9.44 18.01 7 14.61 7 11V7.18L12 5zm-1 3v4h2V8h-2zm0 6v2h2v-2h-2z"/></svg>
    </div>
    <div class="page-title">${title}</div>
    <div class="page-sub" style="margin-bottom:16px">${msg}</div>
    <div class="credits">Credits to ducky</div>
  </div>`);
}

// ============================================================
// VIEW: MEMBER LOGIN (for regular users with invite token)
// This view is also hidden — only shown via secret entry or
// direct URL with a one-time token param
// ============================================================
function showMemberAuth(){
  const locked=isLockedOut();
  render(`<div class="card">
    <div class="logo-icon green" style="margin:0 auto 14px">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
    </div>
    <div class="page-title text-center">Member access</div>
    <div class="page-sub text-center" style="margin-bottom:20px">Sign in to your account.</div>
    ${locked?`<div class="alert alert-red" style="display:block">Too many failed attempts. Try again in ${lockoutRemaining()} minute(s).</div>`:''}
    <div id="auth-alert" class="alert alert-red"></div>
    <div class="fg"><label>Username</label>
      <input id="m-user" placeholder="Username" maxlength="20" autocomplete="username" ${locked?'disabled':''}>
    </div>
    <div class="fg"><label>Password</label>
      <input type="password" id="m-pass" placeholder="Password" autocomplete="current-password" ${locked?'disabled':''}>
    </div>
    <button class="btn btn-green ${locked?'disabled':''}" onclick="doMemberLogin()">Sign in</button>
    <div class="divider"></div>
    <p class="hint text-center">New here? Enter your invite token to register.</p>
    <div class="fg mt8"><label>Invite token</label>
      <input id="m-invite" placeholder="Enter invite token" autocomplete="off">
    </div>
    <div class="fg"><label>New username</label>
      <input id="m-newuser" placeholder="Choose a username" maxlength="20" autocomplete="off">
    </div>
    <div class="fg"><label>New password</label>
      <input type="password" id="m-newpass" placeholder="Choose a password" autocomplete="new-password">
    </div>
    <button class="btn btn-ghost" onclick="doMemberRegister()">Create account</button>
    <input class="hp" type="text" id="_hp1" tabindex="-1" autocomplete="off">
    <input class="hp" type="text" id="_hp2" tabindex="-1" autocomplete="off">
    <div class="credits">Credits to ducky</div>
  </div>`);
  setTimeout(()=>{
    document.getElementById('m-pass')?.addEventListener('keydown',e=>{if(e.key==='Enter')doMemberLogin();});
    document.getElementById('m-newpass')?.addEventListener('keydown',e=>{if(e.key==='Enter')doMemberRegister();});
  },0);
}

function authAlert(msg){
  const el=document.getElementById('auth-alert');
  if(!el)return;
  el.textContent=msg;el.style.display='block';
}

function doMemberLogin(){
  if(checkHp()){secLog('HONEYPOT on login');showBlocked('Access denied','Automated access is not permitted.');return;}
  if(isLockedOut()){authAlert(`Locked out. Try again in ${lockoutRemaining()} minutes.`);return;}
  const u=(document.getElementById('m-user')?.value||'').trim();
  const p=document.getElementById('m-pass')?.value||'';
  if(!u||!p){authAlert('Enter username and password.');return;}
  const acct=getAccount();
  if(!acct||acct.username.toLowerCase()!==u.toLowerCase()||acct.passwordHash!==simpleHash(p)){
    const ls=recordLoginAttempt(false);
    secLog(`Failed login: ${u} (attempt ${ls.attempts}/${MAX_LOGIN_ATTEMPTS})`);
    const remaining=MAX_LOGIN_ATTEMPTS-ls.attempts;
    if(remaining<=0){authAlert(`Too many failed attempts. Locked for ${LOGIN_LOCKOUT_MS/60000} minutes.`);}
    else{authAlert(`Incorrect credentials. ${remaining} attempt(s) remaining.`);}
    return;
  }
  recordLoginAttempt(true);
  createSession(acct);
  secLog(`Login: ${acct.username} [${acct.role}]`);
  showDashboard('home');
}

function doMemberRegister(){
  if(checkHp()){secLog('HONEYPOT on register');showBlocked('Access denied','Automated access is not permitted.');return;}
  const invite=(document.getElementById('m-invite')?.value||'').trim();
  const u=(document.getElementById('m-newuser')?.value||'').trim();
  const p=document.getElementById('m-newpass')?.value||'';
  if(invite!==INVITE_TOKEN){authAlert('Invalid invite token.');secLog(`Invalid invite token attempt`);return;}
  if(!u||u.length<3){authAlert('Username must be at least 3 characters.');return;}
  if(!/^[a-zA-Z0-9_]+$/.test(u)){authAlert('Letters, numbers and underscores only.');return;}
  if(!p||p.length<8){authAlert('Password must be at least 8 characters.');return;}
  const existing=getAccount();

    <div class="credits">Credits to ducky</div>
  </div>`);
  setTimeout(()=>{

  },50);

function doAdminLogin(){
  if(isLockedOut()){
    document.getElementById('adm-auth-alert').textContent=`Locked. ${lockoutRemaining()} min remaining.`;
    document.getElementById('adm-auth-alert').style.display='block';
    return;
  }
  const p=document.getElementById('adm-pass')?.value||'';
  if(simpleHash(p)!==ADMIN_PASS_HASH){
    const ls=recordLoginAttempt(false);
    secLog(`Failed admin login (attempt ${ls.attempts})`);
    const el=document.getElementById('adm-auth-alert');
    if(el){el.textContent=`Incorrect password. ${MAX_LOGIN_ATTEMPTS-ls.attempts} attempt(s) left.`;el.style.display='block';}
    if(ls.attempts>=MAX_LOGIN_ATTEMPTS){
      setTimeout(()=>showBlocked('Locked out','Too many failed attempts.'),500);
    }
    return;
  }
  // Check if admin account exists — if not, create it
  let acct=getAccount();
  if(!acct){
    acct=createAccount('admin',simpleHash(p),'admin');
  } else {
    acct.role='admin';
    saveAccount(acct);
  }
  recordLoginAttempt(true);
  createSession(acct);
  secLog('Admin authenticated');
  showDashboard('home');
}

let _lastGenUrl='';
function doGenerate(){
  if(!isAdmin())return;
  const pid=parsePlaceId(document.getElementById('g-place')?.value||'');
  const parsed=parseServerCode(document.getElementById('g-code')?.value||'');
  const allowUsers=parseAllowList(document.getElementById('g-allow')?.value||'');
  const label=(document.getElementById('g-label')?.value||'').trim();
  const alertEl=document.getElementById('gen-alert');
  const outputEl=document.getElementById('gen-output');
  const urlEl=document.getElementById('gen-url');
  if(alertEl)alertEl.style.display='none';
  if(outputEl)outputEl.style.display='none';
  if(!pid){if(alertEl){alertEl.textContent='Place ID missing.';alertEl.style.display='block';}return;}
  if(parsed&&parsed.kind==='share-id'){if(alertEl){alertEl.textContent='That is a share-link ID, not a server code.';alertEl.style.display='block';}return;}
  const base64Id=btoa(pid);
  const baseUrl=window.location.origin+window.location.pathname;
  let url=`${baseUrl}?id=${base64Id}`;
  if(parsed&&parsed.code){url+=`&linkCode=${encodeURIComponent(parsed.code)}`;if(parsed.kind==='legacy')url+=`&codeKind=legacy`;}
  if(allowUsers.length)url+=`&allow=${encodeURIComponent(btoa(allowUsers.join(',')))}`;
  _lastGenUrl=url;
  if(urlEl)urlEl.textContent=url;
  if(outputEl)outputEl.style.display='block';
  recordLinkGen(pid,label);
  secLog(`Link generated for place ${pid}`);
}
function copyGenLink(){
  navigator.clipboard.writeText(_lastGenUrl).then(()=>{
    const a=document.getElementById('gen-alert');
    if(a){a.className='alert alert-green mt8';a.textContent='Copied.';a.style.display='block';}
  });
}
function openGenLink(){if(_lastGenUrl)window.open(_lastGenUrl,'_blank');}
function revokeLink(placeId){
  if(!isAdmin())return;
  localStorage.setItem(`revoked_${placeId}`,'true');
  secLog(`Revoke: place ${placeId}`);
  showDashboard('generate');
}
function doRevoke(shouldRevoke){
  if(!isAdmin())return;
  const id=parsePlaceId(document.getElementById('sec-revoke')?.value||'');
  const a=document.getElementById('sec-alert');
  if(!id){if(a){a.textContent='Enter a Place ID.';a.style.display='block';}return;}

  else{localStorage.removeItem(`revoked_${id}`);secLog(`Restore: ${id}`);if(a){a.textContent=`Place ${id} restored.`;a.className='alert alert-green mt8';a.style.display='block';}}
}
function copyInvite(){
  navigator.clipboard.writeText(INVITE_TOKEN).then(()=>{
    const a=document.getElementById('inv-alert');

function clearHistory(){
  const acct=getAccount();if(!acct||!isValidSession())return;
  acct.launchHistory=[];saveAccount(acct);showDashboard('history');
}
function saveSettings(){
  if(!isValidSession())return;
  const acct=getAccount();if(!acct)return;
  const name=(document.getElementById('s-name')?.value||'').trim();
  const curpass=document.getElementById('s-curpass')?.value||'';
  const pass=document.getElementById('s-pass')?.value||'';
  const pass2=document.getElementById('s-pass2')?.value||'';
  const a=document.getElementById('set-alert');
  // Require current password to save anything
  if(simpleHash(curpass)!==acct.passwordHash){
    if(a){a.className='alert alert-red mt8';a.textContent='Current password incorrect.';a.style.display='block';}return;
  }
  if(name&&name.length>=3&&/^[a-zA-Z0-9_]+$/.test(name))acct.username=name;
  if(pass){
    if(pass.length<8){if(a){a.className='alert alert-red mt8';a.textContent='Password must be at least 8 characters.';a.style.display='block';}return;}
    if(pass!==pass2){if(a){a.className='alert alert-red mt8';a.textContent='Passwords do not match.';a.style.display='block';}return;}
    acct.passwordHash=simpleHash(pass);
    // Regenerate session token after password change
    createSession(acct);
  }
  saveAccount(acct);
  if(a){a.className='alert alert-green mt8';a.textContent='Saved.';a.style.display='block';}
}
function exportData(){
  if(!isValidSession())return;
  const data={account:getAccount(),stats:getStats(),seclog:DB.get(SEC_KEY,[])};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='otxhub-data.json';a.click();
  URL.revokeObjectURL(url);
}
function deleteAccount(){
  if(!isValidSession())return;
  if(!confirm('Delete your account and all data permanently?'))return;
  DB.del(ACCT_KEY);DB.del(STATS_KEY);DB.del(SEC_KEY);
  clearSession();
  doLogout();
}

function updateLaunchBtn(){

function initLauncherVerif(){
  function verify(){
    if(_verifiedHuman)return;
    if(checkHp()){secLog('HONEYPOT on launcher');showBlocked('Access denied','Automated access blocked.');return;}
    _verifiedHuman=true;
    const b=document.getElementById('verif-badge');
    if(b){b.className='verif-badge badge-green';b.innerHTML=`<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Verified browser connection`;}
    updateLaunchBtn();
    ['mousemove','touchstart','keydown'].forEach(e=>window.removeEventListener(e,verify));
  }
  ['mousemove','touchstart','keydown'].forEach(e=>window.addEventListener(e,verify));
}
function doLaunch(){
  if(!_verifiedHuman||!_placeId)return;
  if(checkHp()){secLog('HONEYPOT on launch');showBlocked('Access denied','Automated access blocked.');return;}
  if(tooFast()){secLog('TIMING attack on launch');showBlocked('Access denied','Automated access blocked.');return;}
  const u=sanitize(document.getElementById('launch-user')?.value||'');
  const alertEl=document.getElementById('launch-alert');
  if(!u){if(alertEl){alertEl.textContent='Enter your Roblox username.';alertEl.style.display='block';}return;}
  if(_allowList.length&&!_allowList.includes(u.toLowerCase())){
    if(alertEl){alertEl.textContent="That username isn't on the invite list.";alertEl.style.display='block';}return;
  }
  if(alertEl)alertEl.style.display='none';
  const badge=document.getElementById('verif-badge');
  const btn=document.getElementById('launch-btn');
  const input=document.getElementById('launch-user');
  if(badge){badge.className='verif-badge badge-yellow';badge.innerHTML=`<span>Verifying @${u}…</span>`;}
  if(btn)btn.classList.add('disabled');
  if(input)input.disabled=true;
  setTimeout(()=>{
    if(badge){badge.className='verif-badge badge-green';badge.innerHTML=`<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Verified @${u} — launching…`;}
    if(btn)btn.textContent='Opening Roblox…';
    setTimeout(()=>{
      let url=`roblox://experiences/start?placeId=${_placeId}`;
      if(_rawCode){const p=_codeKind==='legacy'?'accessCode':'linkCode';url+=`&${p}=${encodeURIComponent(_rawCode)}`;}
      window.location.href=url;
      recordLaunch(_placeId,u);
      secLog(`Launch: place ${_placeId} by @${u}`);
      setTimeout(()=>{const f=document.getElementById('fallback-link');if(f)f.style.display='block';},2500);
    },600);
  },900);
}

// ============================================================
// SECRET ENTRY — type "otxadmin" anywhere to open admin auth
// Type "otxmember" anywhere to open member auth
// No URL params, no visible links
// ============================================================
const _MEMBER_ENTRY=[111,116,120,109,101,109,98,101,114]; // "otxmember"

document.addEventListener('keydown',e=>{
  // Only track printable characters
  if(e.key.length===1){
    _entryBuffer.push(e.key.toLowerCase());
    if(_entryBuffer.length>10)_entryBuffer.shift();

    const buf=_entryBuffer.join('');
    const adminSeq=_ENTRY.map(c=>String.fromCharCode(c)).join('');
    const memberSeq=_MEMBER_ENTRY.map(c=>String.fromCharCode(c)).join('');

    if(buf.endsWith(adminSeq)){
      _entryBuffer=[];
      secLog('Admin entry sequence triggered');
      showAdminAuth();
    } else if(buf.endsWith(memberSeq)){
      _entryBuffer=[];
      secLog('Member entry sequence triggered');
      showMemberAuth();
    }
  }
});

// ============================================================
// BOOT
// ============================================================
(function boot(){
  secLog(`Visit | ${Intl.DateTimeFormat().resolvedOptions().timeZone} | ${navigator.userAgent.substring(0,50)}`);
  bumpStat('totalVisits');

  if(checkRate()){
    secLog('RATE LIMIT exceeded');
    const s=getStats();s.securityBlocks=(s.securityBlocks||0)+1;DB.set(STATS_KEY,s);
    showBlocked('Too many requests','Rate limit exceeded. Try again in a minute.');
    return;
  }
  if(detectBot()){
    secLog('BOT detected');
    const s=getStats();s.securityBlocks=(s.securityBlocks||0)+1;DB.set(STATS_KEY,s);
    showBlocked('Access denied','Automated access is not permitted.');
    return;
  }

  const params=new URLSearchParams(window.location.search);
  const encodedId=params.get('id');
  _rawCode=params.get('linkCode')||params.get('accessCode')||params.get('accesscode')||'';
  _codeKind=params.get('codeKind')||'';

  const encodedAllow=params.get('allow');
  if(encodedAllow){try{_allowList=atob(encodedAllow).split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);}catch{_allowList=[];}}

  try{if(encodedId)_placeId=atob(encodedId).trim();}catch{_placeId='';}
  if(!/^\d+$/.test(_placeId))_placeId='';

  // Check revocation
  if(_placeId&&localStorage.getItem(`revoked_${_placeId}`)==='true'){
    showBlocked('Link invalid','This launch URL has been deactivated.');
    return;
  }

  // Valid launch link
  if(_placeId){showLauncher();return;}

  // No launch link — check for valid session
  if(isValidSession()){showDashboard('home');return;}

  // Default: show plain launcher page (no hint of login existing)
  render(`<div class="card text-center">
    <div class="logo-icon green" style="margin:0 auto 14px">
      <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2Zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2Zm4.5 3c-.83 0-1.5-.67-1.5-1.5S14.67 13 15.5 13s1.5.67 1.5 1.5S16.33 16 15.5 16zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 10 18.5 10s1.5.67 1.5 1.5S19.33 13 18.5 13z"/></svg>
    </div>
    <div class="page-title">Roblox Launcher</div>
    <div class="page-sub">Open this page with a valid game launch link.</div>
    <div class="credits">Credits to ducky</div>
  </div>`);
})();
</script>
